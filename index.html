<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sello</title>

    <!-- Fondo de arranque: el MISMO color en el body, aquí, en theme-color y en
         el manifest (#f1f7f4). Se pinta antes de que cargue el JS para que al
         abrir la PWA no haya destello de otro color. -->
    <style>
      html, body { margin: 0; background: #f1f7f4; }
      .sello-arranque { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f1f7f4; }
      .sello-arranque svg { animation: selloArranque 1.4s ease-in-out infinite; }
      @keyframes selloArranque { 50% { opacity: 0.55; } }
      @media (prefers-reduced-motion: reduce) { .sello-arranque svg { animation: none; } }
    </style>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f1f7f4" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS: "default" = barra de estado clara con texto oscuro y la página
         empieza DEBAJO de la hora, la batería y el notch (con fondos claros,
         "black-translucent" pondría texto blanco encima del contenido). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sello" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="description" content="Sello — Programa de lealtad digital para negocios locales" />

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Pantalla de carga: se ve desde el primer instante y la reemplaza la
         primera vista real (main.js usa el mismo marcado mientras resuelve la sesión). -->
    <div id="app"><div class="sello-arranque" role="status" aria-label="Cargando"><svg width="56" height="56" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="20" cy="20" r="18" stroke="#0a5c47" stroke-width="2.5"/><circle cx="20" cy="20" r="12" stroke="#0a5c47" stroke-width="2"/><path d="M14 20l4 4 8-8" stroke="#0a5c47" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
